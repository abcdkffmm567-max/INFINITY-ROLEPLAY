<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Infinity Role Play</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
</head>
<body class="auth-page">
  <div class="bg-grid"></div>
  <header class="nav">
    <a class="brand" href="index.html"><span class="logo-mark">∞</span><span>INFINITY <b>ROLE PLAY</b></span></a>
    <a class="btn small ghost" href="index.html">← Home</a>
  </header>

  <main class="auth-page-main">
    <section class="card standalone-auth">
      <div class="auth-logo">∞</div>
      <span class="eyebrow">WELCOME BACK</span>
      <h1>Login</h1>
      <p>Login to access whitelist applications and live chat.</p>

      <form id="pageLoginForm" class="auth-form">
        <label>Email
          <input required type="email" name="email" autocomplete="email" placeholder="you@example.com">
        </label>
        <label>Password
          <input required type="password" minlength="6" name="password" autocomplete="current-password" placeholder="••••••••">
        </label>
        <button class="btn primary full-width" type="submit">Login</button>
        <div class="auth-divider"><span>OR</span></div>
        <button class="btn google-btn full-width" type="button" id="googleLoginBtn"><svg class="google-logo" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.6 12.23c0-.71-.06-1.4-.18-2.07H12v3.92h5.38a4.6 4.6 0 0 1-2 3.02v2.54h3.24c1.9-1.75 2.98-4.33 2.98-7.41z"/><path fill="#34A853" d="M12 22c2.7 0 4.98-.9 6.64-2.36l-3.24-2.54c-.9.6-2.05.96-3.4.96-2.61 0-4.82-1.76-5.61-4.13H3.04v2.62A10 10 0 0 0 12 22z"/><path fill="#FBBC05" d="M6.39 13.93A6.02 6.02 0 0 1 6.07 12c0-.67.12-1.32.32-1.93V7.45H3.04A10 10 0 0 0 2 12c0 1.61.39 3.14 1.04 4.55l3.35-2.62z"/><path fill="#EA4335" d="M12 5.94c1.47 0 2.78.5 3.82 1.49l2.87-2.87C16.97 2.96 14.7 2 12 2a10 10 0 0 0-8.96 5.45l3.35 2.62C7.18 7.7 9.39 5.94 12 5.94z"/></svg><span>Continue with Google</span></button>
      </form>

      <p id="pageAuthStatus" class="center auth-message"></p>
      <p class="center auth-switch">Don't have an account? <a href="Register.html">Create Account</a></p>
    </section>
  </main>

  <script src="firebase-config.js"></script>
<script src="site-brand.js"></script>
  <script src="user-utils.js"></script>
  <script>
    const form=document.getElementById("pageLoginForm");
    const status=document.getElementById("pageAuthStatus");
    form.addEventListener("submit",async(e)=>{
      e.preventDefault();
      const f=new FormData(form);
      status.textContent="Logging in...";
      try{
        const cred=await auth.signInWithEmailAndPassword(f.get("email"),f.get("password"));
        const profile=await ensureInfinityUser(cred.user);
        if(profile.banned===true){
          const reason=profile.banReason||"";
          await auth.signOut();
          status.textContent="This account is banned."+ (reason ? " Reason: "+reason : "");
          return;
        }
        status.textContent="Login successful. Redirecting...";
        setTimeout(()=>location.href="index.html",600);
      }catch(err){ status.textContent=err.message; }
    });
    const googleProvider=new firebase.auth.GoogleAuthProvider();
    googleProvider.setCustomParameters({prompt:"select_account"});

    async function finishGoogle(user){
      const profile=await ensureInfinityUser(user,{
        displayName:user.displayName||"Player", email:user.email||"",
        photoURL:user.photoURL||"", provider:"google"
      });
      if(profile.banned===true){
        const reason=profile.banReason||"";
        await auth.signOut();
        showNotice("Your Infinity Role Play account is banned."+(reason?" Reason: "+reason:""),"Account Banned","danger");
        return;
      }
      await db.ref("users/"+user.uid+"/lastLoginAt").set(firebase.database.ServerValue.TIMESTAMP);
      status.textContent="Google login successful.";
      setTimeout(()=>location.href="profile.html",500);
    }

    document.getElementById("googleLoginBtn").addEventListener("click",async()=>{
      status.textContent="Opening Google...";
      try{
        const result=await auth.signInWithPopup(googleProvider);
        if(result?.user) await finishGoogle(result.user);
      }catch(err){
        console.error(err);
        let msg=err.message||"Google sign-in failed.";
        if(err.code==="auth/unauthorized-domain") msg="This website domain is not authorized in Firebase. Add your github.io domain to Firebase Authentication > Settings > Authorized domains.";
        else if(err.code==="auth/operation-not-allowed") msg="Google Sign-In is not enabled in Firebase Authentication.";
        else if(err.code==="auth/popup-blocked") msg="Google popup was blocked. Allow popups for this website and try again.";
        else if(err.code==="auth/popup-closed-by-user") msg="Google sign-in was cancelled.";
        else if(err.code==="PERMISSION_DENIED" || /permission_denied|permission denied/i.test(msg)) msg="Google account signed in, but Firebase Database permission blocked the profile sync. Publish the updated database.rules.json from this ZIP.";
        status.textContent=msg;
        if(typeof showNotice==="function") showNotice(msg,"Google Sign-In","danger");
      }
    });

    auth.onAuthStateChanged(user=>{
      if(user && !status.textContent) status.textContent="You are already logged in.";
    });
  </script>
<script src="notifications.js"></script>
</body>
</html>
