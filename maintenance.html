<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>Under Maintenance | Infinity Role Play</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
      font-family:Arial,Helvetica,sans-serif;color:#fff;
      background:radial-gradient(circle at top,#123b70 0,#07111f 42%,#03070d 100%)}
    .card{width:min(620px,100%);padding:42px 26px;text-align:center;border-radius:26px;
      background:rgba(8,20,36,.86);border:1px solid rgba(74,163,255,.35);
      box-shadow:0 24px 80px rgba(0,0,0,.45),0 0 45px rgba(27,127,255,.12)}
    .badge{display:inline-block;padding:8px 14px;border-radius:999px;background:#0c65d8;
      font-weight:800;font-size:12px;letter-spacing:1.5px}
    h1{font-size:clamp(32px,8vw,58px);margin:20px 0 10px;line-height:1}
    h1 span{color:#4aa3ff}
    p{color:#b9c8d9;font-size:17px;line-height:1.65;margin:0 auto;max-width:470px}
    .loader{width:54px;height:54px;margin:28px auto;border:5px solid rgba(255,255,255,.12);
      border-top-color:#4aa3ff;border-radius:50%;animation:spin .9s linear infinite}
    .brand{margin-top:28px;font-weight:900;letter-spacing:2px;color:#dcecff}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">INFINITY ROLE PLAY</div>
    <h1>UNDER <span>MAINTENANCE</span></h1>
    <p>Our website is currently undergoing scheduled maintenance. We’ll be back online soon. Thank you for your patience.</p>
    <div class="loader"></div>
    <div class="brand">INFINITY ROLE PLAY • SRI LANKA</div>
  </main>
</body>
</html>
