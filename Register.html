<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Infinity Role Play</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
</head>
<body class="auth-page">
  <div class="bg-grid"></div>
  <header class="nav">
    <a class="brand" href="index.html"><span class="logo-mark">∞</span><span>INFINITY <b>ROLE PLAY</b></span></a>
    <a class="btn small ghost" href="index.html">← Home</a>
  </header>

  <main class="auth-page-main">
    <section class="card standalone-auth">
      <div class="auth-logo">∞</div>
      <span class="eyebrow">JOIN INFINITY RP</span>
      <h1>Create Account</h1>
      <p>Register your account to submit a whitelist application and use live chat.</p>

      <form id="pageRegisterForm" class="auth-form">
        <label>Display Name
          <input required name="displayName" maxlength="32" placeholder="Your display name">
        </label>
        <label>Email
          <input required type="email" name="email" autocomplete="email" placeholder="you@example.com">
        </label>
        <label>Password
          <input required type="password" minlength="6" name="password" autocomplete="new-password" placeholder="Minimum 6 characters">
        </label>
        <label>Confirm Password
          <input required type="password" minlength="6" name="confirmPassword" autocomplete="new-password" placeholder="Repeat password">
        </label>
        <button class="btn primary full-width" type="submit">Create Account</button>
        <div class="auth-divider"><span>OR</span></div>
        <button class="btn google-btn full-width" type="button" id="googleRegisterBtn">Register with Google</button>
      </form>

      <p id="pageAuthStatus" class="center auth-message"></p>
      <p class="center auth-switch">Already have an account? <a href="login.html">Login</a></p>
    </section>
  </main>

  <script src="firebase-config.js"></script>
  <script>
    const form=document.getElementById("pageRegisterForm");
    const status=document.getElementById("pageAuthStatus");
    form.addEventListener("submit",async(e)=>{
      e.preventDefault();
      const f=new FormData(form);
      if(f.get("password")!==f.get("confirmPassword")){
        status.textContent="Passwords do not match.";
        return;
      }
      status.textContent="Creating account...";
      try{
        const cred=await auth.createUserWithEmailAndPassword(f.get("email"),f.get("password"));
        await cred.user.updateProfile({displayName:f.get("displayName")});
        await db.ref("users/"+cred.user.uid).set({
          displayName:f.get("displayName"),
          email:f.get("email"),
          createdAt:firebase.database.ServerValue.TIMESTAMP
        });
        status.textContent="Account created. Redirecting...";
        setTimeout(()=>location.href="index.html",700);
      }catch(err){ status.textContent=err.message; }
    });

    const googleProvider=new firebase.auth.GoogleAuthProvider();
    document.getElementById("googleRegisterBtn").addEventListener("click",async()=>{
      status.textContent="Opening Google...";
      try{
        const result=await auth.signInWithPopup(googleProvider);
        const user=result.user;
        await db.ref("users/"+user.uid).update({
          displayName:user.displayName||"Player",
          email:user.email||"",
          photoURL:user.photoURL||"",
          provider:"google",
          createdAt:firebase.database.ServerValue.TIMESTAMP
        });
        status.textContent="Google account connected.";
        setTimeout(()=>location.href="index.html",500);
      }catch(err){
        try{
          await auth.signInWithRedirect(googleProvider);
        }catch(e){ status.textContent=err.message; }
      }
    });

    auth.getRedirectResult().then(async result=>{
      if(result && result.user){
        const user=result.user;
        await db.ref("users/"+user.uid).update({
          displayName:user.displayName||"Player",
          email:user.email||"",
          photoURL:user.photoURL||"",
          provider:"google",
          createdAt:firebase.database.ServerValue.TIMESTAMP
        });
        location.href="index.html";
      }
    }).catch(err=>status.textContent=err.message);
  </script>
</body>
</html>
