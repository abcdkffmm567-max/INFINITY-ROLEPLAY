<!doctype html><html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Infinity RP Admin Setup</title><link rel="stylesheet" href="styles.css">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
<style>.setup{max-width:520px;margin:70px auto;padding:18px}.box{padding:24px}label{display:block;margin:16px 0}input{width:100%;margin-top:8px}#status{margin-top:18px;white-space:pre-wrap}</style>
</head><body><div class="bg-grid"></div>
<main class="setup"><section class="card box"><span class="eyebrow">ONE-TIME SETUP</span>
<h2>Enable Infinity Admin</h2><p>This setup can enable only the configured Infinity admin account.</p>
<form id="f" class="auth-form">
<label>Username<input id="u" value="infinityadmin" required></label>
<label>Password<input id="p" type="password" required></label>
<button class="btn primary">Enable Admin</button></form>
<p id="status"></p><a class="btn ghost" href="admin.html">Open Admin Panel</a>
</section></main>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBNRNmZJyxQiAj_AjNHLf43knOEmQ9e-FU",
  authDomain: "l2k-top-up-store.firebaseapp.com",
  databaseURL: "https://l2k-top-up-store-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "l2k-top-up-store",
  storageBucket: "l2k-top-up-store.firebasestorage.app"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
</script><script>
const UID="ewXACA93B8PTVeE09DVEqXfv5Mp1", EMAIL="infinityadmin@infinityrp.com";
const st=document.getElementById("status");
document.getElementById("f").onsubmit=async e=>{
 e.preventDefault(); st.textContent="Checking...";
 if(document.getElementById("u").value.trim().toLowerCase()!=="infinityadmin"){st.textContent="Use username: infinityadmin";return;}
 try{
  const c=await auth.signInWithEmailAndPassword(EMAIL,document.getElementById("p").value);
  if(c.user.uid!==UID){await auth.signOut();throw new Error("Firebase Auth UID does not match the configured admin UID.");}
  const r=db.ref("admins/"+UID), s=await r.once("value");
  if(s.val()===true){st.textContent="Admin is already enabled. Open Admin Panel.";return;}
  await r.set(true);
  st.textContent="SUCCESS! Admin enabled.\nBan / Unban / Verified permissions are now available.";
 }catch(err){console.error(err);let m=err.message||String(err);
  if(err.code==="auth/operation-not-allowed")m="Enable Email/Password in Firebase Authentication first.";
  if(err.code==="auth/invalid-credential"||err.code==="auth/wrong-password")m="Incorrect admin password.";
  if(/permission/i.test(m))m="Publish the included database.rules.json in Realtime Database > Rules first.";
  st.textContent="Setup failed: "+m;
 }
};
</script></body></html>
