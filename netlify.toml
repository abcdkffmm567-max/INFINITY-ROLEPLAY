[build]
  command = "mkdir -p netlify/functions && cp samp-status.js netlify/functions/samp-status.js && cp daily-reward.js netlify/functions/daily-reward.js && cp redeem-code.js netlify/functions/redeem-code.js && cp whitelist-account.js netlify/functions/whitelist-account.js && cp vehicle-shop-api.js netlify/functions/vehicle-shop-api.js"
  publish = "."

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/samp-status"
  to = "/.netlify/functions/samp-status"
  status = 200
  force = true

[[redirects]]
  from = "/api/daily-reward"
  to = "/.netlify/functions/daily-reward"
  status = 200
  force = true

[[redirects]]
  from = "/api/redeem-code"
  to = "/.netlify/functions/redeem-code"
  status = 200
  force = true

[[redirects]]
  from = "/api/whitelist-account"
  to = "/.netlify/functions/whitelist-account"
  status = 200
  force = true

[[redirects]]
  from = "/api/vehicle-shop"
  to = "/.netlify/functions/vehicle-shop-api"
  status = 200
  force = true
