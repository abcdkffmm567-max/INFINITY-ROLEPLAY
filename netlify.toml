[build]
  command = "mkdir -p netlify/functions && cp samp-status.js netlify/functions/samp-status.js && cp daily-reward.js netlify/functions/daily-reward.js"
  publish = "."

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/samp-status"
  to = "/.netlify/functions/samp-status"
  status = 200
  force = true

[[redirects]]
  from = "/api/daily-reward"
  to = "/.netlify/functions/daily-reward"
  status = 200
  force = true
