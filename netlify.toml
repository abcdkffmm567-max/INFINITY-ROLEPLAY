[build]
  command = "mkdir -p netlify/functions && cp samp-status.js netlify/functions/samp-status.js && cp daily-reward.js netlify/functions/daily-reward.js && cp redeem-code.js netlify/functions/redeem-code.js && cp whitelist-account.js netlify/functions/whitelist-account.js && cp vehicle-shop-api.js netlify/functions/vehicle-shop-api.js && cp vehicle-delivery.js netlify/functions/vehicle-delivery.js && cp vehicle-delivery-lib.js netlify/functions/vehicle-delivery-lib.js"
  publish = "."

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/samp-status"
  to = "/.netlify/functions/samp-status"
  status = 200
  force = true

[[redirects]]
  from = "/api/daily-reward"
  to = "/.netlify/functions/daily-reward"
  status = 200
  force = true

[[redirects]]
  from = "/api/redeem-code"
  to = "/.netlify/functions/redeem-code"
  status = 200
  force = true

[[redirects]]
  from = "/api/whitelist-account"
  to = "/.netlify/functions/whitelist-account"
  status = 200
  force = true

[[redirects]]
  from = "/api/vehicle-shop"
  to = "/.netlify/functions/vehicle-shop-api"
  status = 200
  force = true

[functions."vehicle-delivery"]
  schedule = "*/5 * * * *"

# ---------------- SECURITY HARDENING ----------------
# Do not expose setup files, SQL/schema files, rules or serverless source code as static assets.
[[redirects]]
  from = "/admin-setup.html"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/infinity_*.sql"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/database.rules.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/storage.rules"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/daily-reward.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/redeem-code.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/whitelist-account.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/vehicle-shop-api.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/vehicle-delivery.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/vehicle-delivery-lib.js"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebasedatabase.app wss://*.firebaseio.com wss://*.firebasedatabase.app https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; frame-src https://*.firebaseapp.com https://accounts.google.com; upgrade-insecure-requests"

[[headers]]
  for = "/admin.html"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    Pragma = "no-cache"
